schema: spec-driven

context: |
  Tech stack: Python >=3.10 package `faire` (src/faire, tests/), click CLI, pyyaml, jsonschema, copier.
  All git, git-annex and DataLad operations go through the DataLad Python API (datalad.api, ds.repo),
  never subprocess. Platform access only through the platform adapter (python-gitlab for GitLab).
  Dependencies stay minimal: search for a well-maintained package and ask before adding one.
  Rules, checks and site configs are YAML. Tests: pytest; lint: ruff. The tool's own CI is GitHub Actions.
  Domain-agnostic: neuroimaging is only an inspiration, not a requirement of the code.

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
