# Reference dataset template (minimal, domain-agnostic).
_subdirectory: template
_templates_suffix: .jinja

dataset_id:
  type: str
  help: Identifier of the dataset in the ma-DMP

collection_name:
  type: str
  help: Name of the container collection the reference container comes from
  default: containers

collection_source:
  type: str
  help: Where the container collection is cloned from (a DataLad dataset with datalad-container)

collection_path:
  type: str
  help: Subdataset path the collection is installed at
  default: code/containers

collection_revision:
  type: str
  help: Exact commit or tag the collection is pinned to

container_version:
  type: str
  help: Version of the reference container, as named in the collection (tool--VERSION.*)

container_call_fmt:
  type: str
  help: Call format replacing the collection's own for the reference container (optional)
  default: ""

source_dataset:
  type: str
  help: Identifier of the triggering source dataset of the reference rule
  default: ""

dataset_title:
  type: str
  help: Title of the dataset
  default: ""

license:
  type: str
  help: Resolvable license reference of the dataset
  default: ""

license_spdx:
  type: str
  help: SPDX identifier of the license, when it has one
  default: ""

source_instance_glob:
  type: str
  help: "`*/` when the triggering source is an instrument stream (one folder per instrument)"
  default: ""

derived_from:
  type: yaml
  help: Paths under sourcedata/ the dataset is derived from
  default: []
