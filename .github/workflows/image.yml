name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [Dockerfile, .dockerignore, pyproject.toml, src/**, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, src/**, .github/workflows/image.yml]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: faire:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm faire:test faire --version
          docker run --rm faire:test sh -c 'git annex version | head -n 1 && datalad --version && apptainer --version'
          # squashfuse must carry the xattr fix (vasi/squashfuse#149, released in 0.6.3)
          version=$(docker run --rm faire:test apk info -v squashfuse | sed -E 's/^squashfuse-([0-9.]+)-r.*/\1/')
          echo "squashfuse $version"
          test "$(printf '%s\n0.6.3\n' "$version" | sort -V | head -n 1)" = "0.6.3"
      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
