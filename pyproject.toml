[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "faire"
version = "0.1.0"
description = "Data management ecosystem built on the RDA DMP Common Standard (machine-actionable DMP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "datalad>=1.1",
  "datalad-container>=1.2",
  "copier>=9.3",
  "jsonschema>=4.21",
  "python-gitlab>=4.4",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
faire = "faire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs git-annex and DataLad on the machine"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/faire/validate.py" = ["E501"]  # long violation messages kept on one line each
